pathPrefix: /api/conesearch
metrics:
  application: conesearch
  enabled: false
collections:
  test:
    table: test.Object
    idColumn: objectId
    raColumn: coord_ra
    decColumn: coord_dec
    maxSr: 10.0
    maxRecords: 100
    verb1Columns: [objectId, coord_ra, coord_dec]
    verb2Columns: [objectId, coord_ra, coord_dec, flux]
